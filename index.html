<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อู่นัสเซอร์วิส | ระบบค้นหาราคา</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07110c;
      color: #f5f5f5;
    }
    header {
      background: linear-gradient(135deg, #050505, #0d2b1b);
      padding: 24px 16px;
      border-bottom: 2px solid #14c46b;
      text-align: center;
    }
    header h1 {
      margin: 0;
      color: #20e986;
      font-size: 30px;
    }
    header p {
      margin: 8px 0 0;
      color: #d5f7e4;
      font-size: 15px;
    }
    main {
      max-width: 980px;
      margin: auto;
      padding: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: #101713;
      border: 1px solid #1f3b2c;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    h2 {
      margin-top: 0;
      color: #20e986;
      font-size: 20px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 12px;
      border: 1px solid #244b35;
      background: #07110c;
      color: white;
      outline: none;
      font-size: 15px;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #20e986;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #20e986;
      color: #031007;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    button.secondary { background: #203428; color: #eafff2; }
    button.danger { background: #ff4f4f; color: white; }
    .result, .job, .price-row {
      background: #07110c;
      border: 1px solid #234832;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }
    .muted { color: #a9cdb8; font-size: 13px; }
    .price {
      color: #20e986;
      font-size: 22px;
      font-weight: 800;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row button { width: auto; flex: 1; }
    .pill {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #143420;
      color: #9ff6c5;
      font-size: 12px;
      margin-bottom: 6px;
    }
    footer {
      text-align: center;
      color: #7fa58e;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>อู่นัสเซอร์วิส</h1>
    <p>ระบบค้นหาราคาอะไหล่ / งานซ่อม และบันทึกใบงานเบื้องต้น</p>
  </header>

  <main>
    <div class="grid">
      <section class="card">
        <h2>🔍 ค้นหาราคา</h2>
        <input id="searchInput" placeholder="พิมพ์ชื่ออะไหล่หรืองานซ่อม เช่น หัวฉีด, น้ำมันเครื่อง" oninput="searchPrice()" />
        <div id="searchResults"></div>
      </section>

      <section class="card">
        <h2>➕ เพิ่มรายการราคา</h2>
        <input id="itemName" placeholder="ชื่อรายการ เช่น ล้างหัวฉีด" />
        <input id="itemPrice" type="number" placeholder="ราคา เช่น 800" />
        <select id="itemCategory">
          <option value="หัวฉีด">หัวฉีด</option>
          <option value="ห้องเครื่อง">ห้องเครื่อง</option>
          <option value="ช่วงล่าง">ช่วงล่าง</option>
          <option value="อะไหล่">อะไหล่</option>
          <option value="ค่าแรง">ค่าแรง</option>
          <option value="อื่น ๆ">อื่น ๆ</option>
        </select>
        <button onclick="addPriceItem()">บันทึกราคา</button>
        <p class="muted">ข้อมูลจะถูกเก็บในเครื่องที่เปิดเว็บนี้ ถ้าเปลี่ยนเครื่องข้อมูลจะไม่ตามไปด้วย</p>
      </section>

      <section class="card">
        <h2>🧾 เปิดใบงานซ่อม</h2>
        <input id="customerName" placeholder="ชื่อลูกค้า" />
        <input id="carInfo" placeholder="รุ่นรถ / ทะเบียน" />
        <textarea id="repairDetail" placeholder="รายการซ่อม / อะไหล่ที่ใช้"></textarea>
        <input id="repairTotal" type="number" placeholder="ยอดรวม" />
        <select id="jobStatus">
          <option value="รับรถ">รับรถ</option>
          <option value="กำลังซ่อม">กำลังซ่อม</option>
          <option value="เสร็จแล้ว">เสร็จแล้ว</option>
          <option value="รออะไหล่">รออะไหล่</option>
        </select>
        <button onclick="addJob()">บันทึกใบงาน</button>
      </section>
    </div>

    <section class="card" style="margin-top:16px;">
      <h2>📋 รายการราคาในระบบ</h2>
      <div id="priceList"></div>
    </section>

    <section class="card" style="margin-top:16px;">
      <h2>🛠️ ใบงานซ่อม</h2>
      <div id="jobList"></div>
    </section>
  </main>

  <footer>ระบบเริ่มต้นสำหรับอู่ซ่อมรถ | ใช้งานแบบออฟไลน์ได้</footer>

  <script>
    let prices = JSON.parse(localStorage.getItem("garage_prices")) || [
      { name: "ล้างหัวฉีด", price: 800, category: "หัวฉีด" },
      { name: "ซ่อมหัวฉีดดีเซล", price: 1500, category: "หัวฉีด" },
      { name: "เปลี่ยนน้ำมันเครื่อง", price: 500, category: "ห้องเครื่อง" },
      { name: "เปลี่ยนผ้าเบรก", price: 1200, category: "อะไหล่" },
      { name: "ตรวจเช็คช่วงล่าง", price: 300, category: "ช่วงล่าง" },
      { name: "ค่าแรงซ่อมทั่วไป", price: 500, category: "ค่าแรง" }
    ];

    let jobs = JSON.parse(localStorage.getItem("garage_jobs")) || [];

    function saveData() {
      localStorage.setItem("garage_prices", JSON.stringify(prices));
      localStorage.setItem("garage_jobs", JSON.stringify(jobs));
    }

    function money(n) {
      return Number(n || 0).toLocaleString("th-TH");
    }

    function searchPrice() {
      const text = document.getElementById("searchInput").value.trim().toLowerCase();
      const box = document.getElementById("searchResults");
      if (!text) {
        box.innerHTML = '<p class="muted">พิมพ์ชื่อรายการเพื่อค้นหาราคา</p>';
        return;
      }

      const found = prices.filter(p => p.name.toLowerCase().includes(text) || p.category.toLowerCase().includes(text));
      box.innerHTML = found.length ? found.map((p, index) => `
        <div class="result">
          <span class="pill">${p.category}</span>
          <div><b>${p.name}</b></div>
          <div class="price">${money(p.price)} บาท</div>
          <button class="secondary" onclick="useInJob('${p.name.replaceAll("'", "\\'")}', ${p.price})">นำไปใส่ใบงาน</button>
        </div>
      `).join("") : '<p class="muted">ไม่พบรายการนี้ ลองเพิ่มราคาใหม่ได้เลย</p>';
    }

    function useInJob(name, price) {
      const detail = document.getElementById("repairDetail");
      const total = document.getElementById("repairTotal");
      detail.value = detail.value ? detail.value + "\\n" + name + " - " + money(price) + " บาท" : name + " - " + money(price) + " บาท";
      total.value = Number(total.value || 0) + Number(price || 0);
    }

    function addPriceItem() {
      const name = document.getElementById("itemName").value.trim();
      const price = document.getElementById("itemPrice").value;
      const category = document.getElementById("itemCategory").value;

      if (!name || !price) {
        alert("กรุณากรอกชื่อรายการและราคา");
        return;
      }

      prices.push({ name, price: Number(price), category });
      saveData();
      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
      renderPrices();
      searchPrice();
    }

    function deletePrice(i) {
      if (confirm("ลบรายการราคานี้ไหม?")) {
        prices.splice(i, 1);
        saveData();
        renderPrices();
        searchPrice();
      }
    }

    function addJob() {
      const customer = document.getElementById("customerName").value.trim();
      const car = document.getElementById("carInfo").value.trim();
      const detail = document.getElementById("repairDetail").value.trim();
      const total = document.getElementById("repairTotal").value;
      const status = document.getElementById("jobStatus").value;

      if (!customer || !car || !detail) {
        alert("กรุณากรอกชื่อลูกค้า รุ่นรถ/ทะเบียน และรายการซ่อม");
        return;
      }

      jobs.unshift({
        customer, car, detail, total: Number(total || 0), status,
        date: new Date().toLocaleString("th-TH")
      });

      saveData();
      document.getElementById("customerName").value = "";
      document.getElementById("carInfo").value = "";
      document.getElementById("repairDetail").value = "";
      document.getElementById("repairTotal").value = "";
      renderJobs();
    }

    function deleteJob(i) {
      if (confirm("ลบใบงานนี้ไหม?")) {
        jobs.splice(i, 1);
        saveData();
        renderJobs();
      }
    }

    function renderPrices() {
      const box = document.getElementById("priceList");
      box.innerHTML = prices.map((p, i) => `
        <div class="price-row">
          <span class="pill">${p.category}</span>
          <b>${p.name}</b><br>
          <span class="price">${money(p.price)} บาท</span>
          <div class="row">
            <button class="secondary" onclick="useInJob('${p.name.replaceAll("'", "\\'")}', ${p.price})">ใส่ใบงาน</button>
            <button class="danger" onclick="deletePrice(${i})">ลบ</button>
          </div>
        </div>
      `).join("");
    }

    function renderJobs() {
      const box = document.getElementById("jobList");
      box.innerHTML = jobs.length ? jobs.map((j, i) => `
        <div class="job">
          <span class="pill">${j.status}</span>
          <b>👤 ${j.customer}</b><br>
          🚗 ${j.car}<br>
          🕒 ${j.date}<br>
          <pre style="white-space:pre-wrap;font-family:inherit;">${j.detail}</pre>
          <div class="price">รวม ${money(j.total)} บาท</div>
          <button class="danger" onclick="deleteJob(${i})">ลบใบงาน</button>
        </div>
      `).join("") : '<p class="muted">ยังไม่มีใบงาน</p>';
    }

    renderPrices();
    renderJobs();
    searchPrice();
  </script>
</body>
</html>
